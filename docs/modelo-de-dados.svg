<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1150" viewBox="0 0 1360 1150" role="img" aria-labelledby="title description">
<title id="title">Refúgio — modelo de dados</title>
<desc id="description">Cinco entidades. Um ponto de refúgio pode ter zero ou várias medições, recursos e ocorrências. Um usuário pode registrar zero ou várias ocorrências. Cada medição e recurso pertence a um único ponto. Cada ocorrência tem exatamente um ponto e um usuário. PK identifica a chave primária; FK identifica a chave estrangeira. O par ponto e tipo é único em recurso_ponto.</desc>
<defs>
<marker id="arrow-medicao" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#167f8d"/></marker>
<marker id="arrow-recurso" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#3466b2"/></marker>
<marker id="arrow-ocorrencia" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#a35f28"/></marker>
<marker id="arrow-usuario" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7Z" fill="#7952b0"/></marker>
</defs>
<rect x="0" y="0" width="1360" height="1150" rx="0" fill="#f5f8fa"/>
<rect x="64" y="43" width="34" height="5" rx="2" fill="#27745d"/>
<text x="112" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#27745d" font-weight="700" text-anchor="start">REFÚGIO / MODELO DE DADOS</text>
<text x="64" y="109" font-family="Segoe UI, Arial, sans-serif" font-size="40" fill="#172c38" font-weight="700" text-anchor="start">Como os dados se conectam</text>
<text x="64" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#536474" font-weight="400" text-anchor="start">Pontos reúnem recursos, medições e relatos. Usuários são os autores das ocorrências.</text>
